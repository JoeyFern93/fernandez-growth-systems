name: Verify Replay Cam TV pairing

on:
  push:
    branches: [qa/replay-camera-dashboard-tv-20261120]
    paths:
      - 'site/replay/**'
      - 'apps/site-review/worker.js'
      - 'apps/site-review/replay-pair.js'
      - 'tests/replay-tv-e2e.mjs'
      - '.github/workflows/replay-tv-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tv-and-phone:
    name: Real video from a simulated phone to the TV
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Match the current QR format in the existing smoke test
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/replay-tv-e2e.mjs')
          source = path.read_text()
          old = r'/^#pair=[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/'
          new = r'/^#pair=[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43}&key=[A-Za-z0-9_-]{43}$/'
          assert source.count(old) == 1
          path.write_text(source.replace(old, new))
          PY
      - name: Run the packaged website and signalling Worker in isolation
        run: node tests/replay-tv-e2e.mjs
        env:
          FGS_CHROME_BIN: /usr/bin/google-chrome
          REPLAY_SITE_ROOT: site
          REPLAY_WORKER_ROOT: apps/site-review
          REPLAY_QA_PROOF: replay-tv-proof
