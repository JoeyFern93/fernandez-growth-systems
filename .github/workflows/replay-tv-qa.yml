name: Verify Replay Cam TV pairing

on:
  push:
    branches: [qa/replay-camera-dashboard-tv-20261120, qa/replay-controls-20261120]
    paths:
      - 'site/replay/**'
      - 'apps/site-review/worker.js'
      - 'apps/site-review/replay-*.js'
      - 'apps/site-review/schema.sql'
      - 'tests/replay-tv-*.mjs'
      - '.github/workflows/replay-tv-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tv-and-phone:
    name: Phone to TV / ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Direct video
            scenario: ''
            jpeg: '0'
            without_rtc: '0'
          - label: Encrypted video on a blocked network
            scenario: --relay
            jpeg: '0'
            without_rtc: '0'
          - label: Encrypted images on a TV without WebRTC
            scenario: --relay
            jpeg: '1'
            without_rtc: '1'
          - label: Phone controls and replay sizing over direct video
            scenario: --controls
            jpeg: '0'
            without_rtc: '0'
          - label: Phone controls and replay sizing over encrypted video
            scenario: --controls --relay
            jpeg: '0'
            without_rtc: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Send simulated phone camera frames through the packaged app
        run: node tests/replay-tv-e2e.mjs ${{ matrix.scenario }}
        env:
          FGS_CHROME_BIN: /usr/bin/google-chrome
          REPLAY_SITE_ROOT: site
          REPLAY_WORKER_ROOT: apps/site-review
          REPLAY_QA_PROOF: replay-tv-proof
          REPLAY_QA_RELAY_JPEG: ${{ matrix.jpeg }}
          REPLAY_QA_TV_WITHOUT_RTC: ${{ matrix.without_rtc }}
