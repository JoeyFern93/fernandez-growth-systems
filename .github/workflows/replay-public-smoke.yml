name: Verify deployed Replay Cam relay once

on:
  push:
    branches: [qa/replay-public-smoke-after-release-20261120]
    paths:
      - 'tests/replay-public-smoke.mjs'
      - '.github/workflows/replay-public-smoke.yml'
  workflow_dispatch:
    inputs:
      run_one_public_room:
        type: boolean
        required: true
        default: false
        description: Use one simulated camera on the deployed site

permissions:
  contents: read

jobs:
  internet-relay:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_one_public_room) ||
      (github.event_name == 'push' && github.event.head_commit.message == 'Run one public Replay Cam relay smoke test')
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test deployed TV replay with a simulated camera
        env:
          FGS_CHROME_BIN: /usr/bin/google-chrome
        run: node tests/replay-public-smoke.mjs --public
